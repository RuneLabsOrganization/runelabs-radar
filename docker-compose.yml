services:
  web:
    build:
      context: .
      target: web
    ports:
      - '127.0.0.1:3121:3000' # reverse proxy points here
    env_file: .env
    environment:
      DATABASE_PATH: /data/radar.db
    volumes:
      - ./data:/data
    restart: unless-stopped

  worker:
    build:
      context: .
      target: worker
    env_file: .env
    environment:
      DATABASE_PATH: /data/radar.db
      # embedding model weights must survive container recreation
      TRANSFORMERS_CACHE: /data/hfcache
    volumes:
      - ./data:/data
    restart: unless-stopped
    depends_on:
      - web

  mcp:
    build:
      context: .
      target: worker # full source + node_modules; different entrypoint
    command: ['npx', 'tsx', 'mcp/server.ts']
    ports:
      - '127.0.0.1:3122:3122' # reverse proxy: mcp.<domain> or /<prefix> → here
    env_file: .env
    environment:
      DATABASE_PATH: /data/radar.db
      MCP_PORT: 3122
    volumes:
      - ./data:/data # NOT :ro — the MCP process writes the plan cache (opportunities.plan*)
    restart: unless-stopped
    depends_on:
      - web
